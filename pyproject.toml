[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tm_bot"
version = "0.1.0"
description = "Local Terraforming Mars agents and data pipeline"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["tm_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
